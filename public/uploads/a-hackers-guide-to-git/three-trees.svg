<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 1010 128" width="1010" height="128" font-size="18">
  <title>three-trees</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e3436"/>
    </marker>
    <marker id="arrow-ghost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888a85"/>
    </marker>
  </defs>
  
  <path d="M 180 8.647887323943664 Q 267.5 -16 350 7.239436619718312" fill="none" stroke="#2e3436" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="266.25" y="-12.028169014084506" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e3436">git add</text>
  <path d="M 540 9.324675324675326 Q 637.5 -16 710 2.8311688311688314" fill="none" stroke="#2e3436" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="631.25" y="-12.96103896103896" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e3436">git commit</text>
  <path d="M 710 65.16883116883116 Q 637.5 84 540 58.675324675324674" fill="none" stroke="#2e3436" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="631.25" y="92.96103896103895" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e3436">git restore --staged</text>
  <path d="M 350 60.76056338028169 Q 267.5 84 180 59.352112676056336" fill="none" stroke="#2e3436" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="266.25" y="92.02816901408451" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e3436">git restore</text>
  <g id="wt">
    <rect x="0" y="0" width="180" height="68" fill="#ffffff" stroke="#888a85" stroke-width="1.5"/>
    <text x="16" y="24" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="16" font-weight="bold" fill="#2e3436">Working tree</text>
    <text x="16" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e3436">the files you edit</text>
  </g>
  <g id="idx">
    <rect x="350" y="0" width="190" height="68" fill="#fcaf3e" stroke="#ce5c00" stroke-width="1.5"/>
    <text x="366" y="24" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="16" font-weight="bold" fill="#2e3436">Index</text>
    <text x="366" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e3436">the next commit's tree</text>
  </g>
  <g id="repo">
    <rect x="710" y="0" width="240" height="68" fill="#729fcf" stroke="#3465a4" stroke-width="1.5"/>
    <text x="726" y="24" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="16" font-weight="bold" fill="#2e3436">Repository</text>
    <text x="726" y="48" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2e3436">commits reachable from HEAD</text>
  </g>
</svg>
